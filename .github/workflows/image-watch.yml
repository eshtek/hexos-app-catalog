# Opens a pull request when a custom app's image has a newer tag than its script pins
# (_lib/image_watch.ts): one per app on image-watch/<app>, and a draft on image-watch/<app>-major for
# the next major version, each kept up to date as newer tags appear until a person commits to it.
# Nothing here merges; an update is tested on a lab box first.
#
# A pull request opened with the workflow's own token starts no other workflow, so Validate doesn't
# run on it by itself; the pull request script runs the validator and the version check before it
# pushes. Set the IMAGE_WATCH_TOKEN secret (a GitHub App or fine-grained token with contents and
# pull requests write on this repository) to have Validate run as it does for anyone else; without
# it, close and reopen the pull request to start Validate. The repository must allow GitHub Actions
# to create pull requests (Settings, Actions, General).
name: Image watch

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: image-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    # Seconds of registry calls and a push per app; anything approaching this is a hang.
    timeout-minutes: 15
    defaults:
      run:
        # bash with pipefail, so a failure piped through tee still fails its step
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.IMAGE_WATCH_TOKEN || github.token }}
      BASE: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.IMAGE_WATCH_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: _lib
      - name: Find newer images
        id: check
        # A registry that doesn't answer fails this step after the other apps are planned, so their
        # pull requests still open and the run still ends red
        continue-on-error: true
        run: bun _lib/image_watch.ts check --out "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open or refresh a pull request per update
        run: |
          [ -f "$RUNNER_TEMP/plan.json" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --no-tags origin "+refs/heads/image-watch/*:refs/remotes/origin/image-watch/*"
          failed=0
          for id in $(jq -r '.updates[].id' "$RUNNER_TEMP/plan.json"); do
            if ! bash _lib/image_watch_pr.sh "$RUNNER_TEMP/plan.json" "$id" | tee -a "$GITHUB_STEP_SUMMARY"; then
              echo "::error::The pull request for $id could not be opened"
              failed=1
            fi
          done
          exit "$failed"
      - name: Fail when a registry didn't answer
        if: steps.check.outcome == 'failure'
        run: exit 1
